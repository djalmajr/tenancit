services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: konvario
      POSTGRES_DB: konvario
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONVARIO_ADDR: ":8080"
      KONVARIO_DATABASE_URL: "postgres://postgres:konvario@postgres:5432/konvario?sslmode=disable"
      # demo admin token. Replace in real deployments.
      KONVARIO_ADMIN_TOKEN: "konvario_admin_dev"
      # demo key (32 bytes, base64). Replace in real deployments.
      KONVARIO_AES_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      KONVARIO_AES_KEY_VERSION: "1"
    ports:
      - "8080:8080"
