services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: tenancit
      POSTGRES_DB: tenancit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TENANCIT_DATABASE_URL: "postgres://postgres:tenancit@postgres:5432/tenancit?sslmode=disable"
    restart: "no"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      TENANCIT_ADDR: ":8080"
      TENANCIT_DATABASE_URL: "postgres://postgres:tenancit@postgres:5432/tenancit?sslmode=disable"
      # demo admin token. Replace in real deployments.
      TENANCIT_ADMIN_AUTH_MODE: "legacy_shared_token"
      TENANCIT_DEV_MODE: "true"
      TENANCIT_ADMIN_TOKEN: "tenancit_admin_dev"
      TENANCIT_VALKEY_URL: "redis://valkey:6379/0"
      # demo key (32 bytes, base64). Replace in real deployments.
      TENANCIT_AES_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      TENANCIT_AES_KEY_VERSION: "1"
      TENANCIT_OPERATIONS_REPORT_TOKEN: "tenancit_operations_report_dev_123456789"
      TENANCIT_OPERATIONS_REPORT_CREDENTIAL_VERSION: "local-dev-v1"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
    name: tenancit-postgres-data
