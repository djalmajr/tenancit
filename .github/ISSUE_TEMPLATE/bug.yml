name: Bug report
description: Report a reproducible Tenancit defect without sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, tokens, secrets, personal data, DSNs, or private environment details here. Follow SECURITY.md for private disclosure.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use disposable data and redact every credential or environment identifier.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: OS, browser, Go/Bun versions, and deployment shape only.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I confirmed this report contains no secrets, personal data, or private infrastructure details.
          required: true
