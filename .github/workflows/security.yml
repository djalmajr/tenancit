name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: scan complete Git history
        run: gitleaks git --redact --config .gitleaks.toml
