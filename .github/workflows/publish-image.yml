name: Publish image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify release channel
        id: release_channel
        env:
          TENANCIT_IMAGE_REF_TYPE: ${{ github.ref_type }}
          TENANCIT_IMAGE_REF_NAME: ${{ github.ref_name }}
        run: sh ./scripts/classify-image-release.sh
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release_channel.outputs.publish_latest }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          build-args: VCS_REF=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Publish immutable reference
        env:
          TENANCIT_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf "### Published image\n\n\`ghcr.io/%s@%s\`\n" \
            "$GITHUB_REPOSITORY" "$TENANCIT_IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
