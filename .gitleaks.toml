title = "Tenancit secret scanning"

[extend]
useDefault = true

# Valores públicos e deliberadamente determinísticos usados somente em
# Compose/docs/testes. Não adicione aqui credenciais de ambientes reais.
[[allowlists]]
description = "Fixtures de desenvolvimento documentadas"
regexTarget = "secret"
regexes = [
  '''^MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=$''',
  '''^0123456789abcdef0123456789abcdef$''',
  '''^tnc_fixture_value_long$''',
]
