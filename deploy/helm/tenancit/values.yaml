image:
  repository: ghcr.io/djalmajr/tenancit
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
existingSecret: tenancit-runtime

# Exposição HTTP. Em clusters corporativos que não usam traefik/ACME:
#   className: nginx  +  tlsSecretName: <secret TLS existente>  (nenhuma
#   annotation de cert-manager é emitida quando tlsSecretName está preenchido).
# enabled: false publica só o Service ClusterIP — o consumo (/v1/identify,
# /v1/resolve) continua acessível dentro do cluster e o painel admin fica em
# `kubectl port-forward`.
ingress:
  enabled: true
  className: traefik
  tlsSecretName: ""
  # The only public path exposed by this chart. It must equal app.basePath;
  # the SPA plus human auth/admin APIs are served below this prefix, while
  # root /v1 consumer APIs, operations endpoints and health stay internal.
  path: /

app:
  # Runtime SPA mount. One immutable image can therefore be used at / or below
  # a shared-host prefix such as /tenancit.
  basePath: /

public:
  host: tenancit.example.invalid
  oidcHost: tenancit-id.example.invalid
  tlsClusterIssuer: letsencrypt-prod

# Autenticação do painel admin.
#   oidc (default): operação real — exige as chaves oidc-client-secret etc.
#   legacy_shared_token: bootstrap/lab SEM exposição pública (ingress.enabled
#     false + port-forward). Liga TENANCIT_DEV_MODE=true por exigência do
#     servidor e lê TENANCIT_ADMIN_TOKEN da chave admin-token do existingSecret
#     (mínimo 16 caracteres). Nunca use com o painel exposto.
adminAuth:
  mode: oidc

oidc:
  issuerPath: /dex
  clientId: tenancit
  roleClaim: email
  roleMappings: '{"admin@tenancit.local":"security_admin"}'

resources:
  app:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  jobs:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }

personal:
  enabled: false
  createAcmeIssuer: true
  acmeEmail: admin@example.invalid
  storageClassName: local-path
  postgresStorage: 5Gi
  dexStorage: 256Mi
  postgresImage: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
  valkeyImage: valkey/valkey@sha256:cfe71288f087704b06be45e270afa7a2abbf820093d6b11a23762081f5ff321d
  dexImage: ghcr.io/dexidp/dex@sha256:5d0656fce7d453c0e3b2706abf40c0d0ce5b371fb0b73b3cf714d05f35fa5f86
  traefikNamespace: traefik
