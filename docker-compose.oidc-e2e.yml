services:
  postgres-oidc-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "${TENANCIT_OIDC_E2E_DB_PASSWORD:?TENANCIT_OIDC_E2E_DB_PASSWORD is required}"
      POSTGRES_DB: tenancit-oidc-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenancit-oidc-e2e"]
      interval: 1s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  valkey-oidc-e2e:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:16380:6379"
    tmpfs:
      - /data

  dex-oidc-e2e:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./e2e/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:15556:5556"
